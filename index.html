<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0005;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:sans-serif}
#wrap{position:relative;width:100%;max-width:420px;height:100%;max-height:750px}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
let W, H, dpr;

function resize(){
  dpr = window.devicePixelRatio||1;
  const r = wrap.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

const urlParams = new URLSearchParams(location.search);
const challengeScore = parseInt(urlParams.get('challenge')||'0')||0;

function getBest(){return parseInt(localStorage.getItem('tf_best')||'0');}
function setBest(s){localStorage.setItem('tf_best',String(s));}
function getDailyBest(){
  const today = new Date().toDateString();
  const d = JSON.parse(localStorage.getItem('tf_daily')||'{}');
  return d.date===today?(d.score||0):0;
}
function setDailyBest(s){
  const today = new Date().toDateString();
  localStorage.setItem('tf_daily',JSON.stringify({date:today,score:s}));
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(Date.now());

let state='start';
let score=0, best=getBest();
let frameCount=0;
let shakeTimer=0, shakeMag=0;
let hitStopTimer=0;
let gameOverTimer=0;
let retryReady=false;
let meltdownTriggered=false;
let deathPhase='cold';

let phase='cold';
let phaseTimer=0;
let phaseTransition=0;
let phaseTransitioning=false;
let bgHue=240;
let bgHueTgt=240;
let flashTimer=0;

function getPhaseDuration(){
  if(score<15) return 8;
  if(score<35) return 6;
  if(score<60) return 4;
  if(score<100) return 2.5;
  return 1.5;
}
function getScrollSpeed(){
  if(score<15) return 1;
  if(score<35) return 1.1;
  if(score<60) return 1.25;
  if(score<100) return 1.4;
  return 1.6;
}
function getGapSize(){
  if(score<15) return 175;
  if(score<35) return 150;
  if(score<60) return 130;
  if(score<100) return 110;
  return 90;
}

let bird={x:0,y:0,vy:0,w:28,h:20,wing:0,wingTimer:0,alive:true,meltScale:1,trail:[]};
function resetBird(){
  bird.x=W*0.25; bird.y=H*0.45;
  bird.vy=0; bird.alive=true;
  bird.wing=0; bird.wingTimer=0;
  bird.meltScale=1; bird.trail=[];
}

function flap(){
  if(state==='playing'&&bird.alive){
    if(phase==='cold') bird.vy=-7.5;
    else bird.vy=-10;
    bird.wing=0; bird.wingTimer=0;
  }
}

function getGravity(){
  if(phaseTransitioning) return lerp(phase==='cold'?0.38:0.04, phase==='cold'?0.04:0.38, phaseTransition);
  return phase==='cold'?0.38:0.04;
}
function getUpDrift(){return phase==='hot'&&!phaseTransitioning?-0.08:0;}

let vents=[];
let ventSpawnTimer=0;

function getVentSpacing(){return Math.max(160, 240-score*0.7);}

function spawnVent(x){
  const gap=getGapSize();
  const topMin=60, topMax=H-gap-80;
  const topH=topMin+rng()*(topMax-topMin);
  const type=getVentType();
  const isDecoy=(score>=100&&rng()<0.2);
  vents.push({
    x, gapY:topH, gapSize:gap,
    type, isDecoy,
    decoyTimer:isDecoy?(0.5+rng()*0.3):0,
    decoyVisible:isDecoy,
    glowPhase:rng()*Math.PI*2,
    passed:false,
    shattered:false,
    _nearMissed:false,
    lavaDrops:[]
  });
}
function getVentType(){
  if(score<15) return 'obsidian';
  if(score<35) return rng()<0.6?'obsidian':'magma';
  if(score<60){
    const r=rng();
    if(r<0.4) return 'obsidian';
    if(r<0.7) return 'magma';
    return 'brittle';
  }
  const r=rng();
  if(r<0.35) return 'obsidian';
  if(r<0.6) return 'magma';
  return 'brittle';
}

let emberMeter=0;
let meltdownMode=false;
let meltdownTimer=0;
const MELTDOWN_DURATION=4;
let multiplier=1;

function triggerMeltdown(){
  if(meltdownMode) return;
  meltdownMode=true;
  meltdownTimer=MELTDOWN_DURATION;
  multiplier=3;
  meltdownTriggered=true;
  for(let i=0;i<30;i++) spawnParticle(bird.x+bird.w/2,bird.y+bird.h/2,'meltdown');
}

let particles=[];
function spawnParticle(x,y,type,extra){
  const p={x,y,type,life:1,maxLife:1,vx:0,vy:0,size:4,hue:30,gravity:0,rot:undefined,rotSpd:0,radius:0,maxRadius:60};
  if(type==='ember'){
    const a=rng()*Math.PI*2, spd=1+rng()*3;
    p.vx=Math.cos(a)*spd; p.vy=Math.sin(a)*spd-1;
    p.maxLife=0.3+rng()*0.3; p.life=p.maxLife;
    p.size=2+rng()*4; p.hue=extra||30;
  } else if(type==='nearmiss'){
    const a=rng()*Math.PI*2, spd=0.5+rng()*2;
    p.vx=Math.cos(a)*spd; p.vy=Math.sin(a)*spd;
    p.maxLife=0.3; p.life=p.maxLife;
    p.size=2+rng()*3; p.hue=40;
  } else if(type==='meltdown'){
    const a=rng()*Math.PI*2, spd=2+rng()*5;
    p.vx=Math.cos(a)*spd; p.vy=Math.sin(a)*spd;
    p.maxLife=0.5+rng()*0.5; p.life=p.maxLife;
    p.size=4+rng()*8; p.hue=20+rng()*40;
  } else if(type==='death'){
    const a=rng()*Math.PI*2, spd=1+rng()*6;
    p.vx=Math.cos(a)*spd; p.vy=Math.sin(a)*spd-2;
    p.gravity=0.15;
    p.maxLife=1.2; p.life=p.maxLife;
    p.size=3+rng()*6; p.hue=20+rng()*40;
  } else if(type==='debris'){
    p.vx=(rng()-0.5)*4; p.vy=1+rng()*3;
    p.gravity=0.12;
    p.maxLife=1.5; p.life=p.maxLife;
    p.size=4+rng()*6; p.hue=extra||200;
    p.rot=rng()*Math.PI*2; p.rotSpd=(rng()-0.5)*0.2;
  } else if(type==='lavadrop'){
    p.vx=(rng()-0.5)*1; p.vy=0.5+rng()*1.5;
    p.gravity=0.08;
    p.maxLife=1.2; p.life=p.maxLife;
    p.size=3+rng()*4; p.hue=20+rng()*30;
  }
  particles.push(p);
}

let popTexts=[];
function spawnPopText(x,y,text,color){
  popTexts.push({x,y,text,color:color||'#fff',life:1,vy:-1.2});
}

let goldRings=[];
function spawnGoldRing(x,y){goldRings.push({x,y,r:0,life:1});}

let mtns=[];
function buildMountains(){
  mtns=[];
  for(let layer=0;layer<2;layer++){
    const pts=[];
    for(let x=0;x<=W+200;x+=50){
      pts.push({x,y:H*(0.55+layer*0.05)+(rng()-0.5)*(layer?40:80)});
    }
    mtns.push({pts,layer,ox:0});
  }
}

let streak=0, streakDisplay=0, streakTimer=0;

function killBird(bx,by){
  if(!bird.alive) return;
  bird.alive=false;
  deathPhase=phase;
  hitStopTimer=6;
  shakeTimer=30; shakeMag=8;
  for(let i=0;i<40;i++) spawnParticle(bx,by,'death');
  gameOverTimer=0;
  retryReady=false;
}

function startGame(){
  rng=mulberry32(Date.now());
  score=0; frameCount=0;
  phase='cold'; phaseTimer=0; phaseTransition=0; phaseTransitioning=false;
  bgHue=240; bgHueTgt=240;
  vents=[]; particles=[]; popTexts=[]; goldRings=[];
  ventSpawnTimer=0;
  emberMeter=0; meltdownMode=false; meltdownTimer=0; multiplier=1;
  streak=0; streakDisplay=0; streakTimer=0;
  shakeTimer=0; hitStopTimer=0; gameOverTimer=0; retryReady=false;
  meltdownTriggered=false; flashTimer=0;
  buildMountains();
  resetBird();
  spawnVent(W+80);
  spawnVent(W+80+getVentSpacing());
  state='playing';
}

function addScore(n){
  const earned=n*multiplier;
  score+=earned;
  if(score>best){best=score;setBest(best);}
  if(score>getDailyBest()) setDailyBest(score);
}

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}

function switchPhase(){
  phase=phase==='cold'?'hot':'cold';
  bgHueTgt=phase==='cold'?240:20;
  phaseTransitioning=true;
  phaseTransition=0;
  flashTimer=8;
}

function drawBg(hue){
  const isDark=hue>100;
  const g=ctx.createLinearGradient(0,0,0,H);
  if(isDark){
    g.addColorStop(0,`hsl(${hue},60%,5%)`);
    g.addColorStop(1,`hsl(${hue},50%,10%)`);
  } else {
    g.addColorStop(0,`hsl(${hue},80%,8%)`);
    g.addColorStop(1,`hsl(${hue+10},90%,15%)`);
  }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawMountains(hue){
  const colors=[`hsl(${hue<100?hue+10:220},40%,12%)`,`hsl(${hue<100?hue+10:220},35%,18%)`];
  for(let li=0;li<mtns.length;li++){
    const m=mtns[li];
    const ptCount=m.pts.length;
    const segW=W/(ptCount-1);
    ctx.beginPath();
    ctx.moveTo(0,H);
    for(let i=0;i<ptCount;i++){
      const px=((m.pts[i].x+m.ox)%(W+200))+0;
      if(i===0) ctx.moveTo(px,m.pts[i].y);
      else ctx.lineTo(px,m.pts[i].y);
    }
    ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle=colors[li]; ctx.fill();
  }
}

function drawGround(hue){
  const gy=GROUND_Y();
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,hue<100?'#3a1500':'#0a0a20');
  g.addColorStop(1,hue<100?'#1a0800':'#050510');
  ctx.fillStyle=g;
  ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle=hue<100?'#ff6600':'#334466';
  ctx.fillRect(0,gy,W,3);
}

const GROUND_Y=()=>H-30;
const CEIL_Y=20;
const VWIDTH=52;

function ventIsSolid(v){
  if(v.type==='obsidian') return true;
  if(v.type==='brittle') return !v.shattered;
  if(v.type==='magma') return phase==='hot';
  return true;
}

function drawVent(v, t){
  if(v.isDecoy&&!v.decoyVisible) return;
  const isSolid=ventIsSolid(v);
  const glow=0.6+0.4*Math.sin(t*2+v.glowPhase);
  let topColor,capColor;
  if(v.type==='obsidian'){topColor='#1a1212';capColor='#440000';}
  else if(v.type==='magma'){
    const al=isSolid?1:0.4;
    topColor=`rgba(180,60,0,${al})`;
    capColor=`rgba(255,120,0,${al})`;
  } else {
    topColor=v.shattered?'rgba(60,30,0,0.3)':'#2a1500';
    capColor='#885500';
  }
  if(v.shattered) return;

  const topH=v.gapY;
  const botY=v.gapY+v.gapSize;
  const botH=H-botY;

  ctx.save();
  if(v.type==='magma'&&!isSolid) ctx.globalAlpha=0.4;

  if(topH>0){
    ctx.fillStyle=topColor;
    ctx.fillRect(v.x,0,VWIDTH,topH);
    ctx.fillStyle=capColor;
    ctx.fillRect(v.x-4,topH-14,VWIDTH+8,14);
    if(v.type==='magma'&&isSolid){
      const gg=ctx.createLinearGradient(0,topH-30,0,topH);
      gg.addColorStop(0,'rgba(255,120,0,0)');
      gg.addColorStop(1,`rgba(255,150,0,${0.5*glow})`);
      ctx.fillStyle=gg;
      ctx.fillRect(v.x-6,topH-30,VWIDTH+12,30);
    }
    if(v.type==='brittle'){
      ctx.strokeStyle='rgba(255,180,0,0.35)';
      ctx.lineWidth=1;
      for(let ci=0;ci<3;ci++){
        ctx.beginPath();
        ctx.moveTo(v.x+8+ci*13,topH-14);
        ctx.lineTo(v.x+4+ci*13,topH-45);
        ctx.stroke();
      }
    }
  }

  if(botH>0){
    ctx.fillStyle=topColor;
    ctx.fillRect(v.x,botY,VWIDTH,botH);
    ctx.fillStyle=capColor;
    ctx.fillRect(v.x-4,botY,VWIDTH+8,14);
    if(v.type==='magma'&&isSolid){
      const gg=ctx.createLinearGradient(0,botY,0,botY+30);
      gg.addColorStop(0,`rgba(255,150,0,${0.5*glow})`);
      gg.addColorStop(1,'rgba(255,120,0,0)');
      ctx.fillStyle=gg;
      ctx.fillRect(v.x-6,botY,VWIDTH+12,30);
    }
    if(v.type==='brittle'){
      ctx.strokeStyle='rgba(255,180,0,0.35)';
      ctx.lineWidth=1;
      for(let ci=0;ci<3;ci++){
        ctx.beginPath();
        ctx.moveTo(v.x+8+ci*13,botY+14);
        ctx.lineTo(v.x+4+ci*13,botY+45);
        ctx.stroke();
      }
    }
    // lava drops in meltdown
    if(meltdownMode&&v.lavaDrops){
      ctx.globalAlpha=1;
      v.lavaDrops.forEach(d=>{
        ctx.fillStyle=`hsla(${d.hue},100%,55%,${d.life})`;
        ctx.beginPath();
        ctx.arc(d.x,d.y,d.size,0,Math.PI*2);
        ctx.fill();
      });
    }
  }
  ctx.restore();
}

function checkCollision(v){
  if(v.shattered||!ventIsSolid(v)) return false;
  if(v.isDecoy&&!v.decoyVisible) return false;
  const bx=bird.x,by=bird.y,bw=bird.w,bh=bird.h;
  const pad=4;
  if(bx+bw-pad<v.x||bx+pad>v.x+VWIDTH) return false;
  if(by+bh-pad<v.gapY||by+pad>v.gapY+v.gapSize) return false;
  return true;
}

const NEAR_MISS_DIST=14;
function checkNearMiss(v){
  if(!ventIsSolid(v)) return false;
  if(v.isDecoy&&!v.decoyVisible) return false;
  const bx=bird.x+bird.w/2, by=bird.y+bird.h/2;
  const vRight=v.x+VWIDTH;
  if(bx<v.x-20||bx>vRight+20) return false;
  const horizDist=Math.max(0,Math.max(v.x-bx,bx-vRight));
  if(horizDist>8) return false;
  const distTop=Math.abs(by-v.gapY);
  const distBot=Math.abs(by-(v.gapY+v.gapSize));
  return distTop<NEAR_MISS_DIST||distBot<NEAR_MISS_DIST;
}

function drawBird(bx,by,wingState,sc,trailArr,isMeltdown){
  ctx.save();
  ctx.translate(bx+bird.w/2,by+bird.h/2);
  ctx.scale(sc,sc);
  const tilt=clamp(bird.vy*3,-45,30);
  ctx.rotate(tilt*Math.PI/180);

  if(isMeltdown&&trailArr.length>0){
    trailArr.forEach((tr,i)=>{
      const a=(1-i/trailArr.length)*0.35;
      ctx.save();
      ctx.globalAlpha=a;
      ctx.translate(tr.x-(bx+bird.w/2),tr.y-(by+bird.h/2));
      ctx.fillStyle=`hsl(${20+i*8},100%,55%)`;
      ctx.beginPath();
      ctx.ellipse(0,0,bird.w/2*(1-i/trailArr.length*0.4),bird.h/2*(1-i/trailArr.length*0.4),0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  ctx.fillStyle=isMeltdown?'#ff6600':'#4488ff';
  ctx.beginPath();
  ctx.ellipse(0,0,bird.w/2,bird.h/2,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=isMeltdown?'#ff9900':'#66aaff';
  if(wingState===0){
    ctx.beginPath();
    ctx.ellipse(-2,-bird.h/2*0.6,bird.w/2*0.65,bird.h/2*0.45,0,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(-2,bird.h/2*0.6,bird.w/2*0.65,bird.h/2*0.45,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(bird.w/2*0.45,-bird.h/2*0.2,3.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(bird.w/2*0.45+0.6,-bird.h/2*0.2,1.5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#ffaa00';
  ctx.beginPath();
  ctx.moveTo(bird.w/2*0.75,0);
  ctx.lineTo(bird.w/2*0.75+8,0);
  ctx.lineTo(bird.w/2*0.75,3);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    const a=Math.max(0,p.life);
    if(p.type==='goldring') return;
    ctx.save();
    ctx.globalAlpha=a;
    if(p.rot!==undefined){
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=`hsl(${p.hue},90%,55%)`;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    } else {
      ctx.fillStyle=`hsl(${p.hue},100%,55%)`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });

  goldRings.forEach(gr=>{
    ctx.save();
    ctx.strokeStyle=`rgba(255,220,0,${gr.life})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(gr.x,gr.y,gr.r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });
}

function drawPopTexts(){
  popTexts.forEach(pt=>{
    ctx.save();
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.6)';
    ctx.lineWidth=3;
    ctx.strokeText(pt.text,pt.x,pt.y);
    ctx.fillStyle=pt.color;
    ctx.fillText(pt.text,pt.x,pt.y);
    ctx.restore();
  });
}

function drawHUD(){
  ctx.textAlign='center';
  ctx.font='bold 36px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.fillText(score,W/2,50);

  ctx.font='13px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText(`BEST: ${best}`,W/2,68);

  const barW=100,barH=6,barX=(W-barW)/2,barY=78;
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=phase==='cold'?'#4488ff':'#ff6600';
  ctx.fillRect(barX,barY,barW*(phaseTimer/getPhaseDuration()),barH);

  ctx.font='bold 10px sans-serif';
  ctx.fillStyle=phase==='cold'?'#88aaff':'#ff8844';
  ctx.fillText(phase==='cold'?'COLD PHASE':'HOT PHASE',W/2,96);

  const emX=14,emY=H-90,emW=12,emH=80;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(emX,emY,emW,emH);
  const emFill=emberMeter*emH;
  const emg=ctx.createLinearGradient(0,emY+emH,0,emY);
  emg.addColorStop(0,'#ff4400');
  emg.addColorStop(0.5,'#ff8800');
  emg.addColorStop(1,'#ffdd00');
  ctx.fillStyle=emg;
  ctx.fillRect(emX,emY+emH-emFill,emW,emFill);
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=1;
  ctx.strokeRect(emX,emY,emW,emH);
  ctx.font='7px sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('EMBER',emX+emW/2,emY+emH+10);

  if(meltdownMode){
    const pulse=0.85+0.15*Math.sin(Date.now()/80);
    ctx.font=`bold ${Math.round(17*pulse)}px sans-serif`;
    ctx.fillStyle=`hsl(40,100%,60%)`;
    ctx.fillText('MELTDOWN x3',W/2,H-14);
    ctx.font='bold 20px sans-serif';
    ctx.fillStyle='#ffdd00';
    ctx.fillText('x3',W-25,50);
  }

  if(challengeScore>0&&score<challengeScore){
    ctx.strokeStyle='rgba(255,255,0,0.45)';
    ctx.lineWidth=1;
    ctx.setLineDash([8,4]);
    const ty=H*0.38;
    ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(W,ty);ctx.stroke();
    ctx.setLineDash([]);
    ctx.font='11px sans-serif';
    ctx.fillStyle='rgba(255,255,0,0.65)';
    ctx.fillText(`Beat: ${challengeScore}`,W-55,ty-4);
  }
}

function drawMeltdownBloom(){
  const pulse=0.5+0.3*Math.sin(Date.now()/120);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W);
  g.addColorStop(0,`rgba(255,200,80,${0.12*pulse})`);
  g.addColorStop(0.6,`rgba(255,80,0,${0.06*pulse})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawStart(){
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);
  const t=Date.now()/1000;
  const pulse=0.96+0.04*Math.sin(t*2.2);
  ctx.save();
  ctx.translate(W/2,H*0.26);
  ctx.scale(pulse,pulse);
  ctx.textAlign='center';
  ctx.font='bold 12px sans-serif';
  ctx.fillStyle='#ff8844';
  ctx.fillText('EMBER FLAP',0,-8);
  ctx.font='bold 38px sans-serif';
  ctx.fillStyle='#ffffff';
  ctx.fillText('THERMAL',0,30);
  ctx.fillStyle='#ff4400';
  ctx.fillText('FRENZY',0,66);
  ctx.restore();

  ctx.textAlign='center';
  ctx.font='12px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText('Gravity flips: HEAVY  vs  WEIGHTLESS',W/2,H*0.50);
  ctx.fillText('Fly near vents to charge MELTDOWN',W/2,H*0.545);
  ctx.fillStyle='rgba(255,180,80,0.7)';
  ctx.fillText('MELTDOWN = x3 score for 4 seconds',W/2,H*0.59);

  const bt=0.6+0.4*Math.sin(t*3);
  ctx.font='bold 17px sans-serif';
  ctx.fillStyle=`rgba(255,220,100,${bt})`;
  ctx.fillText('TAP TO START',W/2,H*0.72);

  if(best>0){
    ctx.font='13px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.fillText(`Best: ${best}`,W/2,H*0.80);
  }
  if(challengeScore>0){
    ctx.fillStyle='rgba(255,255,100,0.7)';
    ctx.fillText(`Challenge: Beat ${challengeScore}!`,W/2,H*0.85);
  }
}

function drawGameOver(){
  const fade=Math.min(1,(gameOverTimer-1.2)/0.3);
  if(fade<=0) return;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';

  ctx.font='bold 68px sans-serif';
  ctx.fillStyle='#ffffff';
  ctx.fillText(score,W/2,H*0.30);

  const isNewBest=score>=best&&score>0;
  ctx.font='bold 16px sans-serif';
  if(isNewBest){
    const pg=0.7+0.3*Math.sin(Date.now()/180);
    ctx.fillStyle=`rgba(255,220,0,${pg})`;
    ctx.fillText('NEW BEST!',W/2,H*0.40);
  } else {
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText(`Best: ${best}`,W/2,H*0.40);
    const delta=score-best;
    ctx.font='11px sans-serif';
    ctx.fillStyle='rgba(255,100,100,0.65)';
    ctx.fillText(`${delta} from your best`,W/2,H*0.45);
  }

  ctx.font='12px sans-serif';
  if(meltdownTriggered){
    ctx.fillStyle='#ff8800';
    ctx.fillText('MELTDOWN TRIGGERED - x3 for 4s!',W/2,H*0.525);
  } else {
    const pct=Math.round(emberMeter*100);
    ctx.fillStyle='rgba(255,170,70,0.8)';
    ctx.fillText(`${pct}% charged - need 3 near-misses`,W/2,H*0.525);
  }

  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText(`Died in ${deathPhase.toUpperCase()} phase`,W/2,H*0.57);

  if(retryReady){
    const rt=0.7+0.3*Math.sin(Date.now()/280);
    ctx.font='bold 17px sans-serif';
    ctx.fillStyle=`rgba(255,220,100,${rt})`;
    ctx.fillText('TAP ANYWHERE TO RETRY',W/2,H*0.72);
  }

  // share button
  ctx.fillStyle='rgba(255,255,255,0.12)';
  roundRect(ctx,W-68,10,58,26,7);
  ctx.fill();
  ctx.font='11px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('SHARE',W-39,28);

  ctx.restore();
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function update(dt){
  if(hitStopTimer>0){hitStopTimer--;return;}

  if(phaseTransitioning){
    phaseTransition+=dt/0.25;
    if(phaseTransition>=1){phaseTransition=1;phaseTransitioning=false;}
  }
  if(flashTimer>0) flashTimer--;

  bgHue=lerp(bgHue,bgHueTgt,0.09);

  if(mtns.length>0){
    mtns[0].ox-=getScrollSpeed()*0.45*dt*60;
    mtns[1].ox-=getScrollSpeed()*0.9*dt*60;
  }

  if(state==='playing'&&bird.alive){
    phaseTimer+=dt;
    if(phaseTimer>=getPhaseDuration()){phaseTimer=0;switchPhase();}

    bird.vy+=getGravity()+getUpDrift();
    bird.vy=clamp(bird.vy,-15,15);
    bird.y+=bird.vy;

    bird.wingTimer+=dt;
    if(bird.wingTimer>0.15){bird.wingTimer=0;bird.wing^=1;}

    bird.meltScale=meltdownMode?1.2:1;

    if(meltdownMode){
      bird.trail.unshift({x:bird.x+bird.w/2,y:bird.y+bird.h/2});
      if(bird.trail.length>6) bird.trail.pop();
      if(frameCount%4===0) spawnParticle(bird.x+bird.w/2,bird.y+bird.h/2,'ember',rng()*40+10);
    } else {
      if(bird.trail.length) bird.trail=[];
    }

    if(bird.y+bird.h>GROUND_Y()){bird.y=GROUND_Y()-bird.h;killBird(bird.x+bird.w/2,bird.y+bird.h/2);}
    if(bird.y<CEIL_Y){bird.y=CEIL_Y;bird.vy=0;}

    // vents
    const spd=getScrollSpeed()*2.4;
    ventSpawnTimer+=dt;
    const spacing=getVentSpacing()/spd/60;
    if(ventSpawnTimer>=spacing){ventSpawnTimer=0;spawnVent(W+60);}

    for(let i=vents.length-1;i>=0;i--){
      const v=vents[i];
      v.x-=spd*dt*60/60;

      if(v.isDecoy){
        v.decoyTimer-=dt;
        if(v.decoyTimer<=0) v.decoyVisible=false;
      }

      if(meltdownMode&&v.type!=='obsidian'&&frameCount%10===0){
        v.lavaDrops.push({
          x:v.x+rng()*VWIDTH,
          y:v.gapY+v.gapSize,
          vx:(rng()-0.5)*0.5,vy:0.5+rng(),
          size:3+rng()*4,hue:20+rng()*30,life:1,maxLife:1,gravity:0.05
        });
      }
      v.lavaDrops.forEach(d=>{d.y+=d.vy;d.vy+=d.gravity;d.x+=d.vx;d.life-=dt/1.2;});
      v.lavaDrops=v.lavaDrops.filter(d=>d.life>0);

      if(!v.passed&&v.x+VWIDTH<bird.x){
        v.passed=true;
        addScore(1);
        streak++;
        if(streak>=2) spawnPopText(bird.x+bird.w/2,bird.y-24,`x${streak}`,streak>=5?'#ff4400':streak>=3?'#ffaa00':'#ffee88');
      }

      if(!v.passed&&!v._nearMissed&&checkNearMiss(v)){
        v._nearMissed=true;
        if(v.type==='brittle'){
          v.shattered=true;
          for(let di=0;di<8;di++) spawnParticle(v.x+rng()*VWIDTH,v.gapY+rng()*v.gapSize,'debris',30);
        }
        emberMeter=Math.min(1,emberMeter+0.34);
        if(emberMeter>=1&&!meltdownMode) triggerMeltdown();
        spawnGoldRing(bird.x+bird.w/2,bird.y+bird.h/2);
        spawnPopText(bird.x+bird.w/2,bird.y-32,'+NEAR MISS','#ffdd00');
        for(let pi=0;pi<12;pi++) spawnParticle(v.x+VWIDTH/2,v.gapY+rng()*v.gapSize,'nearmiss');
      }

      if(bird.alive&&checkCollision(v)) killBird(bird.x+bird.w/2,bird.y+bird.h/2);

      if(v.x+VWIDTH<-10) vents.splice(i,1);
    }

    if(meltdownMode){
      meltdownTimer-=dt;
      if(meltdownTimer<=0){meltdownMode=false;multiplier=1;emberMeter=0;}
    }
    if(streakTimer>0){streakTimer-=dt;if(streakTimer<=0){streak=0;}}
  }

  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.gravity) p.vy+=p.gravity;
    p.life-=dt/p.maxLife;
    if(p.rot!==undefined) p.rot+=p.rotSpd;
  });
  particles=particles.filter(p=>p.life>0);

  popTexts.forEach(pt=>{pt.y+=pt.vy;pt.life-=dt;});
  popTexts=popTexts.filter(pt=>pt.life>0);

  goldRings.forEach(gr=>{gr.r+=dt*120;gr.life-=dt*2;});
  goldRings=goldRings.filter(gr=>gr.life>0);

  if(shakeTimer>0){shakeTimer--;shakeMag*=0.88;}

  if(!bird.alive){
    gameOverTimer+=dt;
    if(gameOverTimer>=2.5&&!retryReady) retryReady=true;
  }

  frameCount++;
}

function handleTap(ex,ey){
  if(state==='start'){startGame();return;}
  if(state==='playing'){if(bird.alive)flap();return;}
  if(!bird.alive||state==='gameover'){
    if(ex>W-72&&ex<W-6&&ey>6&&ey<40){doShare();return;}
    if(retryReady) startGame();
  }
}

function doShare(){
  const url=`${location.href.split('?')[0]}?challenge=${score}`;
  const text=`I scored ${score} in THERMAL FRENZY — gravity flips between heavy and zero every few seconds. Can you beat me? ${url}`;
  if(navigator.share) navigator.share({title:'Thermal Frenzy',text,url}).catch(()=>{});
  else prompt('Copy to share:',text);
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  handleTap((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){
    e.preventDefault();
    handleTap(W/2,H/2);
  }
});

let lastTime=0;
function frame(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  update(dt);

  let sx=0,sy=0;
  if(shakeTimer>0){sx=(rng()-0.5)*shakeMag;sy=(rng()-0.5)*shakeMag;}

  ctx.save();
  ctx.translate(sx,sy);

  drawBg(bgHue);
  drawMountains(bgHue);
  drawGround(bgHue);
  if(meltdownMode) drawMeltdownBloom();

  const t=frameCount/60;
  vents.forEach(v=>drawVent(v,t));

  drawParticles();

  if(bird.alive||(gameOverTimer<1.4)){
    const flash=flashTimer>0&&(flashTimer%4<2);
    if(!flash){
      drawBird(bird.x,bird.y,bird.wing,bird.meltScale,bird.trail,meltdownMode);
    } else {
      ctx.save();
      ctx.globalAlpha=0.85;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();
      ctx.ellipse(bird.x+bird.w/2,bird.y+bird.h/2,bird.w/2,bird.h/2,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawPopTexts();
  if(state==='playing') drawHUD();
  if(state==='start') drawStart();
  if(!bird.alive) drawGameOver();

  ctx.restore();
  requestAnimationFrame(frame);
}

buildMountains();
requestAnimationFrame(ts=>{lastTime=ts;requestAnimationFrame(frame);});
})();
</script>
